name: generate-verdict

# Live generation of one verdict, fired by /api/generate via repository_dispatch.
#
# Commits land on the `verdicts` branch, never main. That branch has deployments
# switched off in site/vercel.json, so a generation costs ZERO Vercel deploys;
# publish-verdicts.yml promotes them nightly as one commit and one deploy.
#
# The step names below are the contract with the UI: /api/status maps them to
# the five stages the user watches, so the progress feed is the real pipeline
# rather than a decorative animation. Renaming a step changes the UI.

on:
  repository_dispatch:
    types: [generate-verdict]

# One at a time. Two runs pushing to `verdicts` concurrently would race, and a
# cancelled run wastes Gemini quota already spent - so queue, never cancel.
concurrency:
  group: verdict-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APPID: ${{ github.event.client_payload.appid }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup
        run: |
          test -n "$APPID" || { echo "no appid in client_payload"; exit 1; }
          test -n "$GEMINI_API_KEY" || {
            echo "::error::GEMINI_API_KEY is not set in Actions secrets"; exit 1; }
          git fetch origin verdicts:verdicts 2>/dev/null || git branch verdicts
          git checkout verdicts
          git merge --no-edit origin/main || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # --- the five stages the UI shows. Names are load-bearing. ---
      - name: ingest
        run: python pipeline/fetch_reviews.py "$APPID"
      - name: filter
        run: python pipeline/filter_reviews.py "$APPID"
      - name: extract
        run: python pipeline/extract_claims.py "$APPID"
      - name: verdict
        run: python pipeline/synthesize.py "$APPID"

      # invariant 8, in-pipeline, before anything is published. Exit 1 here
      # means the artifact is deleted and nothing is committed.
      - name: qr4
        id: qr4
        run: |
          python pipeline/qr4_gate.py "site/public/verdicts/$APPID.json"

      - name: commit to verdicts branch
        if: success()
        run: |
          git config user.name  "worthit-bot"
          git config user.email "bot@worthit.gg"
          git add "site/public/verdicts/$APPID.json"
          git commit -m "verdict: $APPID (generated live)" || exit 0
          git pull --rebase --autostash origin verdicts || true
          git push origin verdicts || (sleep 5 && git pull --rebase origin verdicts && git push origin verdicts)

      # Always runs, so a failed QR-4 or a dead stage still terminates the UI
      # instead of leaving the user polling forever.
      # This step writes the terminal state the client polls for, so it must not
      # be able to fail the run and must be safe to re-run. continue-on-error is
      # deliberate: a bookkeeping failure must never mark a successful
      # generation as failed.
      - name: record outcome
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" = "success" ]; then OUT=published
          elif [ "${{ steps.qr4.outcome }}" = "failure" ]; then OUT=qr4_failed
          else OUT=stage_failed; fi
          echo "outcome: $OUT"
          if [ "$OUT" != "published" ]; then
            rm -f "site/public/verdicts/$APPID.json" 2>/dev/null || true
          fi

          # Read and fallback are SEPARATE statements on purpose.
          #   CUR=$(gh api ... || echo '{}')
          # concatenates when gh prints output AND exits non-zero - `||` does not
          # discard stdout already emitted - producing '<valid json>{}' and the
          # "Extra data" JSONDecodeError that killed this step. Capture first,
          # inspect the exit status second.
          set +e
          RAW=$(gh api "repos/${{ github.repository }}/actions/variables/LIVE_QUOTA" --jq .value 2>/dev/null)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then RAW=""; fi
          echo "quota variable: rc=$RC, ${#RAW} chars"
          echo "raw: $RAW"

          NEW=$(APPID="$APPID" OUT="$OUT" RUN_ID="${{ github.run_id }}" RAW="$RAW" python3 <<'PY'
          import json, os, datetime

          raw = os.environ.get("RAW", "").strip()
          try:
              state = json.loads(raw) if raw else {}
              if not isinstance(state, dict):
                  raise ValueError("not an object")
          except Exception as exc:
              # never crash: a corrupt ledger must not cost us the terminal state
              print("warning: could not parse quota variable (%s); starting fresh"
                    % exc, file=__import__("sys").stderr)
              state = {}

          # overwrite this appid's entry; re-running the step is a no-op
          outcomes = state.get("outcomes") or {}
          outcomes[os.environ["APPID"]] = {
              "state": os.environ["OUT"],
              "at": datetime.datetime.now(datetime.timezone.utc)
                    .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "run_id": os.environ["RUN_ID"],
          }
          state["outcomes"] = dict(list(outcomes.items())[-200:])
          print(json.dumps(state, separators=(",", ":")))
          PY
          )
          echo "writing ${#NEW} chars"
          # `gh variable set` creates-or-overwrites in one call. The old
          # PATCH-then-POST fallback could double-write on a partial failure.
          printf '%s' "$NEW" | gh variable set LIVE_QUOTA --repo "${{ github.repository }}" --body-file -
