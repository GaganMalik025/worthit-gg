name: generate-verdict

# Live generation of one verdict, fired by /api/generate via repository_dispatch.
#
# Commits land on the `verdicts` branch, never main. That branch has deployments
# switched off in site/vercel.json, so a generation costs ZERO Vercel deploys;
# publish-verdicts.yml promotes them nightly as one commit and one deploy.
#
# The step names below are the contract with the UI: /api/status maps them to
# the five stages the user watches, so the progress feed is the real pipeline
# rather than a decorative animation. Renaming a step changes the UI.

on:
  repository_dispatch:
    types: [generate-verdict]

# The appid, in the run's own name. /api/status needs to tell WHICH request a
# run belongs to, and repository_dispatch does not expose client_payload
# anywhere queryable on the runs API. Without this the route could only assume
# "the oldest active run is yours" - true at a concurrency of one and a lie the
# moment a second person is waiting, who would then watch someone else's stages.
# It is also what lets a FINISHED run be attributed to an appid, which is how
# the terminal state is derived now instead of from a ledger write.
run-name: verdict ${{ github.event.client_payload.appid }}

# One at a time. Two runs pushing to `verdicts` concurrently would race, and a
# cancelled run wastes Gemini quota already spent - so queue, never cancel.
concurrency:
  group: verdict-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APPID: ${{ github.event.client_payload.appid }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # No GH_TOKEN: nothing in this workflow shells out to `gh` any more. The
      # push to `verdicts` uses the credentials actions/checkout persists.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup
        run: |
          test -n "$APPID" || { echo "no appid in client_payload"; exit 1; }
          test -n "$GEMINI_API_KEY" || {
            echo "::error::GEMINI_API_KEY is not set in Actions secrets"; exit 1; }
          # CODE COMES FROM main. FULL STOP.
          #
          # This used to `git checkout verdicts` and then
          # `git merge --no-edit origin/main || true`. The `|| true` swallowed a
          # failed merge, and the run carried on executing whatever code the
          # verdicts branch happened to hold. That branch had drifted 31 commits
          # behind - its synthesize.py still had DEFAULT_MODEL =
          # "gemini-3.5-flash" and none of the tier, cap or force-lite logic -
          # so a LIVE request asked for the 20/day model on a day it was already
          # spent, and died on 429s.
          #
          # The verdicts branch is ARTIFACT STORAGE. No code runs from it. The
          # commit step below reaches for it only to push a file.
          echo "running from $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"
          grep -n "^DEFAULT_MODEL" pipeline/synthesize.py
          python - <<'PROVE'
          import sys, pathlib
          sys.path.insert(0, "pipeline")
          import synthesize
          # Fail the run rather than generate from a build that predates the
          # guards. Cheap, and it is exactly the check that would have caught
          # the stale-branch incident before a single request was spent.
          assert synthesize.DEFAULT_MODEL == "gemini-3.5-flash-lite", \
              "stale code: DEFAULT_MODEL is %s" % synthesize.DEFAULT_MODEL
          assert hasattr(synthesize, "model_for"), "stale code: no model_for()"
          assert hasattr(synthesize, "flash_tier"), "stale code: no flash_tier()"
          print("code check ok: flash-lite default, tier and cap logic present")
          PROVE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # The runner must NOT trust the committed data/live_quota.json. That file
      # is a local artifact of whoever last ran a batch; the copy on main was
      # five days stale and claimed batch_used 11 while the real project-wide
      # flash-lite counter was near its 500/day ceiling. A ledger the runner
      # cannot see is not a guard.
      #
      # THE LEDGER ARRIVES IN THE PAYLOAD. It used to be fetched here with
      # `gh api .../variables/LIVE_QUOTA`, which cannot work: the runner's
      # GITHUB_TOKEN can neither read nor write repository variables. That is
      # not a permissions block we can widen - `variables` is not in
      # GITHUB_TOKEN's surface at all - and the only fix from inside the runner
      # would be a PAT, which this project is not adding.
      #
      # The failure was invisible for two reasons at once: the read ran under
      # `set +e` and fell back to RAW="", and the matching write in `record
      # outcome` is continue-on-error. Both steps reported success while doing
      # nothing, so the one signal that the guard was not working looked exactly
      # like the guard working.
      #
      # /api/generate already holds the real ledger - it reads it to decide
      # whether to dispatch at all - so it now sends the counters along. Same
      # numbers, same source of truth, no second credential.
      #
      # NO FALLBACK. A missing or stale-dated payload means we cannot tell what
      # today has spent, and that is a reason to stop before spending anything
      # rather than to guess from the committed file.
      - name: seed the ledger from the dispatch payload
        env:
          QUOTA_JSON: ${{ toJSON(github.event.client_payload.quota) }}
        run: |
          if [ -z "$QUOTA_JSON" ] || [ "$QUOTA_JSON" = "null" ]; then
            echo "::error::no quota snapshot in the dispatch payload"
            echo "The runner cannot read LIVE_QUOTA itself, so /api/generate must"
            echo "send it. Refusing to generate against the stale committed"
            echo "data/live_quota.json. Nothing was spent."
            exit 1
          fi
          mkdir -p data
          RAW="$QUOTA_JSON" python - <<'SEED'
          import json, os, sys
          sys.path.insert(0, "pipeline")
          import live_quota

          raw = os.environ.get("RAW", "").strip()
          try:
              shared = json.loads(raw)
          except ValueError as exc:
              # Was `except ValueError: shared = {}`, i.e. a corrupt payload
              # seeded zeros and carried on. Zeros are the most permissive
              # possible ledger; guessing them is the one thing this step must
              # never do.
              sys.exit("::error::quota snapshot is not valid JSON (%s). "
                       "Nothing was spent." % exc)
          if not isinstance(shared, dict):
              sys.exit("::error::quota snapshot is not an object. Nothing was spent.")

          state = live_quota.load()          # rolls the day if it is stale
          if shared.get("date") == state["date"]:
              for k in ("live_used", "batch_used", "flash_used",
                        "generations", "batch_generations", "flash_generations"):
                  if isinstance(shared.get(k), int):
                      state[k] = shared[k]
              note = "seeded from dispatch payload"
          else:
              # The quota day rolled between dispatch and run start. The rolled
              # state is CORRECT here, not stale - Google's counters reset at the
              # same boundary - so this proceeds, loudly, rather than failing.
              note = ("payload dated %s, quota day is %s - day rolled in flight, "
                      "using fresh counters" % (shared.get("date"), state["date"]))
          live_quota.save(state)
          print("ledger %s:" % note, json.dumps(
              {k: state[k] for k in ("date", "live_used", "batch_used", "flash_used")}))
          SEED

      # --- the five stages the UI shows. Names are load-bearing. ---
      #
      # Every one goes through generate_one.py, which is the SAME entry point
      # the catalog batch uses. That is the 2.6 principle applied to the live
      # path: one place decides which model a path may use, so the live path
      # cannot quietly diverge from the batch again. Calling the stage scripts
      # directly is what let --force-lite go unpassed and sent a live request
      # to flash.
      #
      # The steps stay separate because /api/status maps these names to the
      # progress feed. One collapsed step would leave the UI nothing to show.
      - name: ingest
        run: python pipeline/generate_one.py "$APPID" --stage ingest --ledger live
      - name: filter
        run: python pipeline/generate_one.py "$APPID" --stage filter --ledger live
      - name: extract
        run: python pipeline/generate_one.py "$APPID" --stage extract --ledger live
      - name: verdict
        run: python pipeline/generate_one.py "$APPID" --stage verdict --ledger live

      # invariant 8, in-pipeline, before anything is published, AND the ledger
      # charge. Exit 1 here means the artifact is deleted and nothing commits.
      - name: qr4
        id: qr4
        run: python pipeline/generate_one.py "$APPID" --stage qr4 --ledger live

      # Artifact storage only. We switch to the branch HERE, after every stage
      # has already run from main's code, carrying just the one file across.
      - name: commit to verdicts branch
        if: success()
        run: |
          git config user.name  "worthit-bot"
          git config user.email "bot@worthit.gg"
          cp "site/public/verdicts/$APPID.json" "/tmp/$APPID.json"
          # ASK THE REMOTE, THEN ACT. This was:
          #     git fetch origin verdicts:verdicts 2>/dev/null || git branch verdicts
          # and the fallback is right for the case it was written for - a first
          # run, where the branch does not exist yet. The bug was that it fired
          # on ANY fetch failure, and `git branch verdicts` with no start point
          # branches from CURRENT HEAD, which here is main's code plus the fresh
          # verdict. A transient network or auth error against an existing
          # branch therefore built the commit on main's history.
          #
          # "The push would reject it" was assumed and is FALSE, reproduced
          # 2026-08-11: the `git pull --rebase` below replays main's commits on
          # top of origin/verdicts, which makes the result a fast-forward, so
          # the push is ACCEPTED and main's files land on the artifact branch.
          # Where the two DO overlap the rebase conflicts instead, and the
          # verdict is lost after its quota was already spent.
          #
          # ls-remote --exit-code separates the cases exactly: rc 2 = absent
          # (legitimate), rc 0 = present, anything else = remote unreachable.
          # Same technique as pipeline/select_publishable.py.
          if git ls-remote --exit-code --heads origin verdicts >/dev/null 2>&1; then
            BRANCH_EXISTS=1
            git fetch origin verdicts:verdicts \
              || { echo "::error::verdicts exists on origin but could not be fetched"; exit 1; }
          else
            BRANCH_EXISTS=0
            echo "no verdicts branch on origin yet - creating it from this run"
            git branch verdicts
          fi
          git checkout verdicts
          mkdir -p site/public/verdicts
          cp "/tmp/$APPID.json" "site/public/verdicts/$APPID.json"
          git add "site/public/verdicts/$APPID.json"
          git commit -m "verdict: $APPID (generated live)" || exit 0
          # No `|| true` here any more. A failed rebase used to be swallowed,
          # and the step then walked into a push that could not succeed and a
          # retry that hit the same conflict - failing anyway, three commands
          # later, with the log pointing at the push instead of the rebase.
          #
          # Guarded on BRANCH_EXISTS, because there is nothing to pull FROM on a
          # first run: `git pull origin verdicts` fails with "couldn't find
          # remote ref verdicts", which `|| true` used to hide. Dropping the
          # swallow without this guard breaks the first-run path - found by the
          # absent-branch fixture, not by reading.
          if [ "$BRANCH_EXISTS" = 1 ]; then
            git pull --rebase --autostash origin verdicts
          fi
          git push origin verdicts || (sleep 5 && git pull --rebase origin verdicts && git push origin verdicts)

      # The artifact is withheld on ANY non-success, so a run that died
      # mid-pipeline cannot leave a partial verdict behind for the commit step
      # or a later run to pick up.
      #
      # THIS STEP NO LONGER RECORDS ANYTHING. It used to write the terminal
      # state into the LIVE_QUOTA repository variable for /api/status to read,
      # under continue-on-error so bookkeeping could never fail a good
      # generation. The runner's GITHUB_TOKEN cannot write repository variables,
      # so the write silently did nothing while the step reported success - and
      # a genuinely failed run left no record at all, which /api/status could
      # only read as a lost dispatch.
      #
      # /api/status now derives the terminal state from this run's own steps
      # (lib/github.ts runOutcome). The steps cannot fail to record themselves,
      # and it needs no credential the runner does not have.
      - name: withhold the artifact on failure
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "outcome: published"
          else
            if [ "${{ steps.qr4.outcome }}" = "failure" ]; then
              echo "outcome: qr4_failed (invariant 8) - withholding the verdict"
            else
              echo "outcome: stage_failed - withholding any partial verdict"
            fi
            rm -f "site/public/verdicts/$APPID.json" 2>/dev/null || true
          fi
