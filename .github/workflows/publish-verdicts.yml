name: publish-verdicts

# Batches live-generated verdicts from the `verdicts` branch into `main`.
#
# Why this exists: generation commits land on `verdicts`, which has deployments
# switched off in site/vercel.json, so a generation costs ZERO Vercel deploys.
# This job is the only thing that moves them to main, as ONE squashed commit and
# ONE deploy - instead of ~50 machine commits and ~50 deploys per day against
# Hobby's 100/day, 100/hour, 60/5min and single-concurrency limits.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: publish-verdicts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # WHICH verdicts may be published - not "all of them".
      #
      # This step used to be `git checkout verdicts -- site/public/verdicts/`,
      # which is a wholesale overwrite rather than a merge, so git reported no
      # conflict and nothing warned. On 2026-08-08 it replayed 68 verdicts
      # generated 1-7 days earlier over 56 regenerated the same day, and logged
      # "Automatic merge went well".
      #
      # The verdicts branch is append-only artifact storage and always holds
      # copies older than main, so age is the thing to check. Skips are printed
      # individually on purpose: a stale copy being dropped must be visible in
      # the log, not inferred from a count.
      #
      # THE FETCH USED TO LIVE HERE, as:
      #     git fetch origin verdicts:verdicts || echo "no verdicts branch yet"
      # and the `||` swallowed its failure. select_publishable.py then returned
      # an empty selection for an unreadable ref, so a broken fetch published
      # nothing and this step reported success - the same shape as the
      # `gh variable set` no-op, where the signal that the guard is broken looks
      # exactly like the guard working.
      #
      # The script now owns the fetch. It reads origin/verdicts, asks the remote
      # whether the branch exists before fetching (so "no branch yet" stays a
      # clean exit 0 and is said out loud), and hard-errors on a fetch failure or
      # an unreadable ref instead of reporting zero. --from is omitted so the
      # hardened default applies rather than being restated here where it could
      # drift.
      - name: Select publishable verdicts
        id: pending
        run: |
          python pipeline/select_publishable.py \
            --into HEAD --apply \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.pending.outputs.n != '0'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # GATE: the dual-path contract test runs against the verdicts we are about
      # to publish - the SELECTED set already written into the working tree by
      # the step above, not the raw branch. Testing the branch would test files
      # we have decided not to publish. If the two render paths have diverged the
      # publish is aborted and the verdicts stay on `verdicts`, still served live
      # by /api/verdict, just not promoted.
      - name: Contract test (merge gate)
        if: steps.pending.outputs.n != '0'
        run: |
          npm ci --prefix site
          npm test --prefix site

      - name: Commit the selected verdicts
        if: steps.pending.outputs.n != '0'
        run: |
          git config user.name  "worthit-bot"
          git config user.email "bot@worthit.gg"
          git add site/public/verdicts/
          git diff --cached --quiet && { echo "nothing staged after selection"; exit 0; }
          git commit -m "publish: ${{ steps.pending.outputs.n }} verdict(s) generated live" \
            -m "Selected by generated_at against main; ${{ steps.pending.outputs.skipped }} older or equal copies skipped. Contract test passed as the merge gate."
          git pull --rebase --autostash origin main
          git push || (sleep 5 && git pull --rebase origin main && git push)
